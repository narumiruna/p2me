name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: changenote-release-main
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the release branch and tags, and create GitHub Releases.
      pull-requests: write # Open and update the managed release pull request.
    outputs:
      published-commit: ${{ steps.changenote.outputs.published == 'true' && steps.changenote.outputs.release-commit || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: changenote/action@b5a808ce21642ccc01587dc66fd34ce522b74da9 # v0.4.0
        id: changenote
        with:
          version: v0.15.0
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          push-git-tags: 'true'
          create-github-releases: 'true'

  publish-crates:
    name: Publish to crates.io
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.published-commit != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the release commit.
      id-token: write # Exchange the GitHub identity for a short-lived crates.io token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.published-commit }}
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-auth
      - name: Upload the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked

  build-pypi:
    name: Build PyPI distributions
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.published-commit != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read # Check out the release commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.published-commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Build PyPI distributions
        run: uv build --out-dir dist/pypi --config-setting 'build-args=--compatibility pypi'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: |
            dist/pypi/*.whl
            dist/pypi/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Authenticate to PyPI with Trusted Publishing.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist/pypi
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Upload the Python package
        run: uv publish --trusted-publishing always dist/pypi/*.whl dist/pypi/*.tar.gz
