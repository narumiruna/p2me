[package]
name = "p2me"
version = "0.0.0"
edition = "2024"
description = "A minimal command-line tool written in Rust."
readme = "README.md"
repository = "https://github.com/narumiruna/p2me"
license = "MIT"
publish = true

[features]
test-endpoint = []

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
